{% extends 'parents/base.html' %}{% block title %}    پروفایل{% endblock %}{% block content %}    <h1>پست‌های من</h1>    <table>        <thead>            <tr>                <th>شماره</th>                <th>عنوان پست</th>                <th>ویرایش</th>                <th>حذف</th>            </tr>        </thead>        <tbody>            {% for post in posts %}                <tr>                    <td>{{ forloop.counter }}</td>                    <td>                        <a href="{{ post.get_absolute_url }}">                            {{ post.title }}                        </a>                    </td>                    <td>                        <a href="#">ویرایش</a>                    </td>                    <td>                        <a href="#">حذف</a>                    </td>                </tr>            {% empty %}                <tr>                    <td colspan="4">هنوز پستی ایجاد نکرده‌اید.</td>                </tr>            {% endfor %}        </tbody>    </table>{% endblock %}
